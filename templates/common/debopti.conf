# =========================================================
# debopty (Debian Optimizer Script) 全局持久化配置文件
# =========================================================

# 是否位于中国大陆 (true/false)
# 用于自动切换 APT 镜像、GitHub 加速以及环境变量代理
IS_CN_REGION=""

# 基础优化完成标记 (true/false)
# 标记系统是否已完成内核调优、安全加固等基础流程
BASE_OPTIMIZED="false"

# 脚本安装标记 (true/false)
# 标记脚本是否已完成自举安装并绑定全局命令
INSTALLED="false"

# 已安装脚本身份（由安装/更新写入，便于离线审计）
SCRIPT_VERSION=""
SCRIPT_BUILD=""

# SSH 安全加固标记 (true/false)
# 标记是否已完成密钥登录强制化与端口随机化
SSH_HARDENED="false"

# 默认使用的文本编辑器
EDITOR_CMD="micro"

# Podman 镜像清理定时器状态 (true/false)
# 由 TUI 选项管理，安装时默认开启
PODMAN_GC_ENABLED="false"

# Yazi 多媒体预览依赖是否安装 (true/false)
# 包含 ffmpeg、poppler-utils、resvg、imagemagick；远程 VPS 可设为 false
# 首次安装 Yazi 时由交互提示写入；留空则下次安装时再次询问
YAZI_MEDIA_PREVIEW=""

# Xray geo 规则自动更新 (true/false)
# 与 XRAY_RULESET 独立；由 TUI「规则自动更新任务」管理；更新 Xray Core 时保持此状态
XRAY_GEO_AUTO_UPDATE=""

# =========================================================
# 可选硬件自适应与留存策略覆盖项 (留空或注释则按宿主机 CPU/RAM/磁盘自动计算)
# =========================================================
# TUNING_FILE_MAX=""
# TUNING_NOFILE=""
# TUNING_TCP_MAX_TW_BUCKETS=""
# TUNING_NET_BUF_MAX=""
# TUNING_BACKLOG=""
# TUNING_TCP_FIN_TIMEOUT=""
# TUNING_TCP_FASTOPEN=""
# TUNING_DEFAULT_QDISC=""
# TUNING_TCP_CC=""
# ZRAM_ALGO=""
# ZRAM_PERCENT=""
# ZRAM_PRIORITY=""
# SWAP_SIZE_MB=""
# JOURNAL_SYSTEM_MAX_USE=""
# JOURNAL_RUNTIME_MAX_USE=""
# JOURNAL_MAX_RETENTION_SEC=""
# CACHE_RETENTION_AGE=""
# APT_CLEAN_CALENDAR=""
# LOGROTATE_ROTATE_COUNT=""
# PODMAN_LOG_SIZE_MAX=""
# BUILD_JOBS=""
