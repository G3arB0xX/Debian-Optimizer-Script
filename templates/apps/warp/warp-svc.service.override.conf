[Service]
# 设置内存软上限，触发 GC 回收 (80M)
MemoryHigh=80M
# 设置内存硬上限，防止内存泄露撑爆 VPS (120M)
MemoryMax=120M
# 屏蔽高频调试日志，仅保留 Error 级输出以保护磁盘寿命
LogLevelMax=error

# --- Security Sandboxing ---
ProtectSystem=full
ProtectHome=true
PrivateTmp=true
NoNewPrivileges=true
# WARP 守护进程通常需要 root 权限和较多能力，这里暂不限制 CapabilityBoundingSet 以防断网
# ---------------------------
