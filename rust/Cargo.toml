[workspace]
resolver = "2"
members = [
    "crates/debopty-core",
    "crates/debopty-bridge",
    "crates/debopty-tui",
    "crates/debopty-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["debopty contributors"]

[workspace.dependencies]
clap = { version = "=4.6.1", features = ["derive"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
thiserror = "=2.0.18"
regex = "=1.12.4"
console = "=0.15.11"
unicode-width = "=0.2.0"
walkdir = "=2.5.0"
tempfile = "=3.27.0"
wait-timeout = "=0.2.1"
libc = "=0.2.191"
ureq = { version = "=3.5.2", default-features = false, features = ["rustls", "gzip"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm"] }
crossterm = "=0.28.1"
assert_cmd = "=2.2.2"
predicates = "=3.1.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
