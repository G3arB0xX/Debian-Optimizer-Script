name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing SemVer tag to publish (e.g. v1.0.0); defaults to current ref"
        required: false
        default: ""

env:
  RUST_TOOLCHAIN: "1.95.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      build: ${{ steps.meta.outputs.build }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve and validate release tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${REF_NAME}}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "ERROR: release tag must be SemVer vX.Y.Z[-prerelease], got '${tag}'" >&2
            exit 1
          fi
          ver="${tag#v}"
          if [[ -f scripts/version.sh ]]; then
            # shellcheck source=scripts/version.sh
            source scripts/version.sh
          else
            # shellcheck source=archive/legacy-bash/scripts/version.sh
            source archive/legacy-bash/scripts/version.sh
          fi
          full="$(debopti_parse_version_file_full VERSION)"
          IFS='|' read -r semver calver build <<< "$full"
          if [[ -z "$semver" ]]; then
            echo "ERROR: VERSION is missing DEBOPTI_SEMVER" >&2
            exit 1
          fi
          if [[ "$ver" != "$semver" ]]; then
            echo "ERROR: tag version '${ver}' != VERSION DEBOPTI_SEMVER '${semver}'" >&2
            exit 1
          fi
          is_pre="false"
          if [[ "$ver" == *-* ]]; then
            is_pre="true"
          fi
          {
            echo "tag=${tag}"
            echo "version=${ver}"
            echo "build=${build}"
            echo "is_prerelease=${is_pre}"
          } >> "$GITHUB_OUTPUT"

      - name: Setup pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt,clippy
          rustup default "${RUST_TOOLCHAIN}"
          rustc -vV && cargo -V && cargo clippy -V && rustfmt -V

      - name: Cache Rust dependencies and artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"

      - name: Run machine gate, release consistency, and git-history hygiene check
        run: |
          set -euo pipefail
          bash tools/check.sh --strict-shellcheck --strict-rust
          bash tools/release.sh verify
          python3 -B tools/verify_repo_hygiene.py --scan-git-history HEAD

      - name: Extract release notes
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-dist
          if ! bash tools/release.sh notes --version "${RELEASE_VERSION}" --output /tmp/release-dist/release-notes.md; then
            printf 'Release %s\n' "${RELEASE_TAG}" > /tmp/release-dist/release-notes.md
          fi

      - name: Build sanitized production assets archive
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-dist
          archive="/tmp/release-dist/debopty-${RELEASE_TAG}.tar.gz"
          tar -czf "${archive}" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.jj' \
            --exclude='.cursor' \
            --exclude='.cache' \
            --exclude='tools' \
            --exclude='.agents' \
            --exclude='governance' \
            --exclude='instructions' \
            --exclude='INDEX.md' \
            --exclude='tests' \
            --exclude='rust' \
            --exclude='archive' \
            --exclude='Makefile' \
            --exclude='AGENTS.md' \
            --exclude='CLAUDE.md' \
            --exclude='GEMINI.md' \
            --exclude='.shellcheckrc' \
            --exclude='.editorconfig' \
            --exclude='.gitignore' \
            .
          entries="$(tar -tzf "${archive}")"
          grep -qxF './install.sh' <<< "$entries"
          grep -qxF './VERSION' <<< "$entries"
          grep -qE '^\./templates/' <<< "$entries"
          if grep -qE '^\./(\.git|\.github|\.jj|\.cursor|\.cache|\.agents|tools|governance|instructions|tests|rust|archive)(/|$)|/INDEX\.md$|^\./(INDEX|AGENTS|CLAUDE|GEMINI)\.md$' <<< "$entries"; then
            echo "ERROR: excluded path leaked into ${archive}" >&2
            exit 1
          fi
          ls -lh /tmp/release-dist

      - name: Upload prepare release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-prepare
          path: |
            /tmp/release-dist/debopty-*.tar.gz
            /tmp/release-dist/release-notes.md
          if-no-files-found: error

  build-rust:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup pinned Rust toolchain and musl target
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --target "${{ matrix.target }}"
          rustup default "${RUST_TOOLCHAIN}"
          rustc -vV && cargo -V

      - name: Cache Rust dependencies and artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"
          key: ${{ matrix.target }}

      - name: Install musl-tools for x86_64 static musl build
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          set -euo pipefail
          sudo apt-get update -yq
          sudo apt-get install -yq musl-tools

      - name: Install clang for aarch64 static musl cross-compile
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          set -euo pipefail
          sudo apt-get update -yq
          sudo apt-get install -yq clang

      - name: Build static Rust binary (x86_64-unknown-linux-musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          set -euo pipefail
          CC_x86_64_unknown_linux_musl=musl-gcc bash -c 'cd rust && cargo build --release --locked --target x86_64-unknown-linux-musl --features ratatui-ui'

      - name: Build static Rust binary (aarch64-unknown-linux-musl)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          set -euo pipefail
          bash -c 'cd rust && cargo build --release --locked --target aarch64-unknown-linux-musl --features ratatui-ui'

      - name: Verify static ELF and package binary archive
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          bin="rust/target/${TARGET}/release/debopty"
          test -x "$bin"
          file_info="$(file "$bin")"
          echo "$file_info"
          if ! grep -Eqi 'statically linked|static-pie linked' <<< "$file_info"; then
            echo "ERROR: ${bin} is not statically linked" >&2
            exit 1
          fi
          if [[ "${TARGET}" == "x86_64-unknown-linux-musl" ]]; then
            ver_out="$("$bin" version)"
            echo "$ver_out"
            if ! grep -qF -- "${RELEASE_VERSION}" <<< "$ver_out"; then
              echo "ERROR: ${bin} version '${ver_out}' does not contain '${RELEASE_VERSION}'" >&2
              exit 1
            fi
          fi
          mkdir -p /tmp/rust-pkg /tmp/rust-dist
          cp "$bin" /tmp/rust-pkg/debopty
          chmod 0755 /tmp/rust-pkg/debopty
          tar -czf "/tmp/rust-dist/debopty-${RELEASE_TAG}-linux-${ARCH}.tar.gz" -C /tmp/rust-pkg debopty
          ls -lh /tmp/rust-dist

      - name: Upload Rust binary archive
        uses: actions/upload-artifact@v4
        with:
          name: release-rust-${{ matrix.arch }}
          path: /tmp/rust-dist/debopty-*-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    needs: [prepare, build-rust]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/release-dist
          merge-multiple: true

      - name: Build unified sorted SHA256SUMS
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          cd /tmp/release-dist
          assets=(
            "debopty-${RELEASE_TAG}.tar.gz"
            "debopty-${RELEASE_TAG}-linux-amd64.tar.gz"
            "debopty-${RELEASE_TAG}-linux-arm64.tar.gz"
          )
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done
          LC_ALL=C sha256sum "${assets[@]}" | LC_ALL=C sort -k2 > SHA256SUMS
          cat SHA256SUMS
          ls -lh

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          dist="/tmp/release-dist"
          assets=(
            "${dist}/debopty-${RELEASE_TAG}.tar.gz"
            "${dist}/debopty-${RELEASE_TAG}-linux-amd64.tar.gz"
            "${dist}/debopty-${RELEASE_TAG}-linux-arm64.tar.gz"
            "${dist}/SHA256SUMS"
          )
          if gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --repo "${GH_REPO}" --clobber
          else
            flags=()
            if [[ "${IS_PRERELEASE}" == "true" ]]; then
              flags+=(--prerelease)
            else
              flags+=(--latest)
            fi
            gh release create "${RELEASE_TAG}" \
              --repo "${GH_REPO}" \
              "${assets[@]}" \
              --title "${RELEASE_TAG}" \
              --notes-file "${dist}/release-notes.md" \
              "${flags[@]}"
          fi
